name: Vérification du sujet
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify-starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vérifier les données et les exemples
        run: python scripts/verifier_donnees.py
      - name: Vérifier la syntaxe des scripts fournis
        run: python -m compileall -q pipeline.py server.py deploy.py check_output.py scripts tests tools
